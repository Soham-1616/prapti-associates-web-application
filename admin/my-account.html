<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account — Prapti Associates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>

<body class="admin-body">

    <!-- ADMIN SIDEBAR -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="sidebar-brand">
                <i class="bi bi-building"></i>
                <span>Prapti <span class="text-gold">Admin</span></span>
            </a>
            <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
        </div>
        <nav class="sidebar-nav">
            <span class="sidebar-section-label">MAIN</span>
            <a href="dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            <span class="sidebar-section-label">CONTENT MANAGEMENT</span>
            <a href="projects.html" class="sidebar-link"><i class="bi bi-grid"></i><span>Projects</span></a>
            <a href="connections.html" class="sidebar-link"><i class="bi bi-people"></i><span>Team Members</span></a>
            <a href="services.html" class="sidebar-link"><i class="bi bi-tools"></i><span>Services</span></a>
            <a href="website-content.html" class="sidebar-link"><i class="bi bi-file-earmark-richtext"></i><span>Website Content</span></a>
            <span class="sidebar-section-label">SYSTEM</span>
            <a href="my-account.html" class="sidebar-link active"><i class="bi bi-person-gear"></i><span>My Account</span></a>
            <a href="#" id="logoutBtn" class="sidebar-link"><i class="bi bi-box-arrow-left"></i><span>Logout</span></a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <header class="admin-topbar">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
            <h4 class="admin-page-title">My Account</h4>
            <div class="admin-user">
                <span id="topbarUsername">Admin</span>
                <div class="admin-avatar"><i class="bi bi-person-circle"></i></div>
            </div>
        </header>

        <div class="admin-content">
            <div class="row g-4">
                <!-- Account Info Column -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-bottom py-3">
                            <h6 class="fw-bold mb-0 text-gold"><i class="bi bi-person-circle me-2"></i>Account Details</h6>
                        </div>
                        <div class="card-body py-4">
                            <div class="text-center mb-4">
                                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px; border: 2px solid #FBBF24;">
                                    <i class="bi bi-person-fill text-gold" style="font-size: 2.5rem;"></i>
                                </div>
                                <h5 class="fw-bold mb-1" id="infoUsername">...</h5>
                                <span class="badge status-badge approved" id="infoStatus">Active</span>
                            </div>
                            <hr class="text-muted opacity-25">
                            <div class="small">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">Role:</span>
                                    <strong class="text-dark">Administrator</strong>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted">Account Status:</span>
                                    <strong class="text-success">Active</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Account Management Forms Column -->
                <div class="col-lg-8">
                    <!-- Update Username Form -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white border-bottom py-3">
                            <h6 class="fw-bold mb-0 text-gold"><i class="bi bi-person-gear me-2"></i>Update Username</h6>
                        </div>
                        <div class="card-body">
                            <form id="usernameForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="currentUsername" class="form-label fw-semibold">Current Username</label>
                                        <input type="text" class="form-control" id="currentUsername" disabled readonly />
                                    </div>
                                    <div class="col-md-6">
                                        <label for="newUsername" class="form-label fw-semibold">New Username *</label>
                                        <input type="text" class="form-control" id="newUsername" required placeholder="Enter new username" />
                                    </div>
                                    <div class="col-12 text-end">
                                        <button type="submit" class="btn btn-gold" id="updateUsernameBtn">
                                            <i class="bi bi-check-lg me-1"></i>Update Username
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Change Password Form -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-bottom py-3">
                            <h6 class="fw-bold mb-0 text-gold"><i class="bi bi-shield-lock-fill me-2"></i>Change Password</h6>
                        </div>
                        <div class="card-body">
                            <form id="passwordForm">
                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label for="currentPassword" class="form-label fw-semibold">Current Password *</label>
                                        <input type="password" class="form-control" id="currentPassword" required placeholder="Enter current password" />
                                    </div>
                                    <div class="col-md-6">
                                        <label for="newPassword" class="form-label fw-semibold">New Password *</label>
                                        <input type="password" class="form-control" id="newPassword" required placeholder="Enter new password" />
                                    </div>
                                    <div class="col-md-6">
                                        <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password *</label>
                                        <input type="password" class="form-control" id="confirmPassword" required placeholder="Confirm new password" />
                                    </div>
                                    <div class="col-12 text-end">
                                        <button type="submit" class="btn btn-gold" id="changePasswordBtn">
                                            <i class="bi bi-check-lg me-1"></i>Change Password
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="adminToast" class="toast align-items-center text-bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Action completed.</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/admin-my-account.js"></script>
</body>

</html>
