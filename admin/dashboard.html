<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — Prapti Associates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>

<body class="admin-body">

    <!-- ADMIN SIDEBAR -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="sidebar-brand">
                <i class="bi bi-building"></i>
                <span>Prapti <span class="text-gold">Admin</span></span>
            </a>
            <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
        </div>
        <nav class="sidebar-nav">
            <span class="sidebar-section-label">MAIN</span>
            <a href="dashboard.html" class="sidebar-link active"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            <span class="sidebar-section-label">CONTENT MANAGEMENT</span>
            <a href="projects.html" class="sidebar-link"><i class="bi bi-grid"></i><span>Projects</span></a>
            <a href="connections.html" class="sidebar-link"><i class="bi bi-people"></i><span>Team Members</span></a>
            <a href="services.html" class="sidebar-link"><i class="bi bi-tools"></i><span>Services</span></a>
            <a href="website-content.html" class="sidebar-link"><i class="bi bi-file-earmark-richtext"></i><span>Website Content</span></a>
            <span class="sidebar-section-label">SYSTEM</span>
            <a href="my-account.html" class="sidebar-link"><i class="bi bi-person-gear"></i><span>My Account</span></a>
            <a href="#" id="logoutBtn" class="sidebar-link"><i class="bi bi-box-arrow-left"></i><span>Logout</span></a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <!-- Top Bar -->
        <header class="admin-topbar">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
            <h4 class="admin-page-title">Dashboard</h4>
            <div class="admin-user">
                <span>Admin</span>
                <div class="admin-avatar"><i class="bi bi-person-circle"></i></div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="admin-content">
            <!-- Overview Cards -->
            <div class="row g-4 mb-5">
                <div class="col-lg-4 col-md-6">
                    <div class="dash-card">
                        <div class="dash-card-icon bg-gold"><i class="bi bi-grid"></i></div>
                        <div class="dash-card-info">
                            <span class="dash-card-number" id="dashProjectCount">—</span>
                            <span class="dash-card-label">Total Projects</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="dash-card">
                        <div class="dash-card-icon" style="background: linear-gradient(135deg, #6366F1, #8B5CF6);"><i class="bi bi-people"></i></div>
                        <div class="dash-card-info">
                            <span class="dash-card-number" id="dashTeamCount">—</span>
                            <span class="dash-card-label">Team Members</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="dash-card">
                        <div class="dash-card-icon bg-success-custom" style="background: linear-gradient(135deg, #10B981, #059669);"><i class="bi bi-tools"></i></div>
                        <div class="dash-card-info">
                            <span class="dash-card-number" id="dashServicesCount">—</span>
                            <span class="dash-card-label">Services</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="dash-card">
                        <div class="dash-card-icon" style="background: linear-gradient(135deg, #10B981, #059669);"><i class="bi bi-house"></i></div>
                        <div class="dash-card-info">
                            <span class="dash-card-number" id="dashResidentialCount">—</span>
                            <span class="dash-card-label">Residential Projects</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="dash-card">
                        <div class="dash-card-icon" style="background: linear-gradient(135deg, #3B82F6, #2563EB);"><i class="bi bi-building"></i></div>
                        <div class="dash-card-info">
                            <span class="dash-card-number" id="dashCommercialCount">—</span>
                            <span class="dash-card-label">Commercial Projects</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="dash-card">
                        <div class="dash-card-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706);"><i class="bi bi-bank"></i></div>
                        <div class="dash-card-info">
                            <span class="dash-card-number" id="dashInstitutionalCount">—</span>
                            <span class="dash-card-label">Institutional Projects</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity Section -->
            <div class="admin-table-card">
                <div class="admin-table-header">
                    <h5><i class="bi bi-clock-history me-2"></i>Recent Activity</h5>
                </div>
                <div class="p-4" id="recentActivityContainer">
                    <div class="text-center text-muted py-3">
                        <i class="bi bi-hourglass-split me-2"></i>Loading recent activity...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const activityContainer = document.getElementById('recentActivityContainer');
            try {
                const [projRes, connRes, srvRes] = await Promise.all([
                    fetch(ADMIN_API + '/api/projects'),
                    fetch(ADMIN_API + '/api/connections'),
                    fetch(ADMIN_API + '/api/services')
                ]);
                const projData = await projRes.json();
                const connData = await connRes.json();
                const srvData = await srvRes.json();

                if (projData.success) {
                    const projects = projData.data;
                    document.getElementById('dashProjectCount').textContent = projects.length;

                    // Category counts
                    const residential = projects.filter(p => p.category === 'residential').length;
                    const commercial = projects.filter(p => p.category === 'commercial').length;
                    const institutional = projects.filter(p => p.category === 'institutional').length;
                    document.getElementById('dashResidentialCount').textContent = residential;
                    document.getElementById('dashCommercialCount').textContent = commercial;
                    document.getElementById('dashInstitutionalCount').textContent = institutional;
                }

                if (connData.success) {
                    document.getElementById('dashTeamCount').textContent = connData.data.length;
                }

                if (srvData.success) {
                    document.getElementById('dashServicesCount').textContent = srvData.data.length;
                }

                // Recent Activity — show summary of data
                let activityHtml = '';
                if (projData.success && projData.data.length > 0) {
                    const latestProject = projData.data[projData.data.length - 1];
                    activityHtml += `
                        <div class="d-flex align-items-center gap-3 mb-3 p-3 rounded" style="background: #F8FAFC;">
                            <div class="rounded-circle d-flex align-items-center justify-content-center" style="width:42px;height:42px;background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#fff;flex-shrink:0;">
                                <i class="bi bi-grid"></i>
                            </div>
                            <div>
                                <div class="fw-semibold" style="font-size:0.9rem;">Latest Project: ${latestProject.name}</div>
                                <div class="text-muted small">${latestProject.category ? latestProject.category.charAt(0).toUpperCase() + latestProject.category.slice(1) : ''} · ${latestProject.location || 'No location'} · ${latestProject.status || 'No status'}</div>
                            </div>
                        </div>`;
                }
                if (connData.success && connData.data.length > 0) {
                    const latestMember = connData.data[connData.data.length - 1];
                    let catLabel = latestMember.category === 'architect' ? 'Architect' :
                                   latestMember.category === 'engineer' ? 'Engineer' :
                                   latestMember.category === 'coworker' ? 'Worker Head' :
                                   latestMember.customCategory || 'Custom';
                    activityHtml += `
                        <div class="d-flex align-items-center gap-3 mb-3 p-3 rounded" style="background: #F8FAFC;">
                            <div class="rounded-circle d-flex align-items-center justify-content-center" style="width:42px;height:42px;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;flex-shrink:0;">
                                <i class="bi bi-person-plus"></i>
                            </div>
                            <div>
                                <div class="fw-semibold" style="font-size:0.9rem;">Latest Team Member: ${latestMember.name}</div>
                                <div class="text-muted small">${latestMember.designation} · ${catLabel}</div>
                            </div>
                        </div>`;
                }

                if (!activityHtml) {
                    activityHtml = `<div class="text-center text-muted py-3"><i class="bi bi-inbox me-2"></i>No recent activity available.</div>`;
                }

                activityContainer.innerHTML = activityHtml;

            } catch (e) {
                activityContainer.innerHTML = `<div class="text-center text-muted py-3"><i class="bi bi-inbox me-2"></i>No recent activity available.</div>`;
            }
        });
    </script>
</body>

</html>
